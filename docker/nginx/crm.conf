# Example site server fragment for Astra CRM edge / frontend nginx.
# Include security_headers.conf and block-sourcemaps.conf from this directory.

include /etc/nginx/snippets/security_headers.conf;
include /etc/nginx/snippets/block-sourcemaps.conf;

# Socket.IO same-origin proxy (matches frontend/src/socket.js default).
location /socket.io {
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://127.0.0.1:9000;
}
