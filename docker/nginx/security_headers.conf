# Astra CRM — override for base-image /etc/nginx/snippets/security_headers.conf
#
# Copy this file over the base snippet in the frontend nginx image so :8830 does
# not ship duplicate XFO or HSTS on HTTP.
#
# App-owned headers (nosniff, Referrer-Policy, CSP, Permissions-Policy) MUST
# pass through from upstream — do not proxy_hide them.
#
# Requires http{} map from security_headers_http.map (see Dockerfile).

# Only hide XFO / HSTS from upstream so this snippet can set a single value.
proxy_hide_header X-Frame-Options;
proxy_hide_header Strict-Transport-Security;

# Single X-Frame-Options (do not also add in server{} blocks).
add_header X-Frame-Options "SAMEORIGIN" always;

# HSTS only when the original client request was HTTPS ($astra_hsts_value from
# security_headers_http.map). Empty value suppresses the header on plain HTTP.
add_header Strict-Transport-Security $astra_hsts_value always;
