# Astra CRM — override for base-image /etc/nginx/snippets/security_headers.conf
#
# Copy this file over the base snippet in the frontend nginx image so :8830 does
# not ship duplicate XFO, list-valued Referrer-Policy, or HSTS on HTTP.
#
# nosniff + Referrer-Policy + CSP + Permissions-Policy are emitted by the app
# (crm.overrides.response_headers). Hide upstream copies so values stay single.
#
# Requires http{} map from security_headers_http.map (see Dockerfile).

proxy_hide_header X-Content-Type-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header X-Frame-Options;
proxy_hide_header Strict-Transport-Security;
proxy_hide_header Content-Security-Policy;
proxy_hide_header Permissions-Policy;

# Single X-Frame-Options (do not also add in server{} blocks).
add_header X-Frame-Options "SAMEORIGIN" always;

# HSTS only when the original client request was HTTPS ($astra_hsts_value from
# security_headers_http.map). Empty value suppresses the header on plain HTTP.
add_header Strict-Transport-Security $astra_hsts_value always;
