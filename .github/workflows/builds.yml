name: Build Container Image
on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "*"

jobs:
  build:
    name: Build

    runs-on: ubuntu-latest

    strategy:
      matrix:
        arch: [amd64, arm64]

    steps:
      - name: Checkout Entire Repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          platforms: linux/${{ matrix.arch }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Branch
        run: |
          export APPS_JSON='[{"url": "https://github.com/frappe/whatsapp","branch": "main"},{"url": "https://github.com/frappe/crm","branch": "main"}]'
          echo "APPS_JSON_BASE64=$(echo $APPS_JSON | base64 -w 0)" >> $GITHUB_ENV
          echo "FRAPPE_BRANCH=version-15" >> $GITHUB_ENV

      - name: Set Image Tag
        run: |
          echo "IMAGE_TAG=stable" >> $GITHUB_ENV

      - uses: actions/checkout@v4
        with:
          repository: frappe/frappe_docker
          path: builds

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          push: true
          context: builds
          file: builds/images/layered/Containerfile
          tags: >
            ghcr.io/${{ github.repository }}:${{ github.ref_name }},
            ghcr.io/${{ github.repository }}:${{ env.IMAGE_TAG }}
          build-args: |
            "FRAPPE_BRANCH=${{ env.FRAPPE_BRANCH }}"
            "APPS_JSON_BASE64=${{ env.APPS_JSON_BASE64 }}"

      # Strip framework *.map and apply Astra nginx snippets on layered images.
      # Backend: docker/Dockerfile.backend-assets (followlinks / find -L).
      # Frontend nginx: docker/Dockerfile.frontend-nginx (override security_headers.conf).
      - name: Bake backend image without sourcemaps
        uses: docker/build-push-action@v6
        with:
          push: true
          context: .
          file: docker/Dockerfile.backend-assets
          tags: >
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}-nosourcemaps
          build-args: |
            "BASE_IMAGE=ghcr.io/${{ github.repository }}:${{ github.ref_name }}"
          platforms: linux/${{ matrix.arch }}

      - name: Bake frontend nginx image (header snippet + no *.map)
        uses: docker/build-push-action@v6
        with:
          push: true
          context: .
          file: docker/Dockerfile.frontend-nginx
          tags: >
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}-frontend-nginx
          platforms: linux/${{ matrix.arch }}