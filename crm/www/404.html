<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Not Found · Astra CRM</title>
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/assets/crm/images/favicon-32.png"
    />
    <script>
      (function () {
        try {
          var t =
            localStorage.getItem('theme') || localStorage.getItem('frappeTheme')
          if (!t || t === 'system' || t === 'auto') {
            t =
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
          }
          document.documentElement.setAttribute('data-theme', t)
          document.documentElement.classList.toggle('dark', t === 'dark')
        } catch (e) {}
      })()
    </script>
    <style>
      :root {
        --bg: #f4f6fa;
        --ink: #1a2332;
        --muted: #5b6578;
        --accent: #0b5fff;
      }
      html.dark,
      html[data-theme='dark'] {
        --bg: #0f1626;
        --ink: #f5f7fb;
        --muted: rgba(255, 255, 255, 0.55);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        font-family:
          'Source Sans 3',
          system-ui,
          sans-serif;
        background: var(--bg);
        color: var(--ink);
      }
      main {
        text-align: center;
        padding: 2rem;
      }
      h1 {
        font-size: 1.5rem;
        margin: 0 0 0.5rem;
      }
      p {
        margin: 0 0 1.25rem;
        color: var(--muted);
      }
      a {
        color: var(--accent);
        text-decoration: none;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Page not found</h1>
      <p>The page you are looking for does not exist.</p>
      <a href="/crm">Back to Astra CRM</a>
    </main>
  </body>
</html>
