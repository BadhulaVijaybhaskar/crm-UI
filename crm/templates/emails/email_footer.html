{# Astra CRM override of the standard email footer — no upstream vendor line. #}
<div class="email-footer-container text-muted {% if email_account_footer or sender_address %}with-divider{% endif %}">
	{% if email_account_footer %}
	<div class="email-account-footer">
		{{ email_account_footer }}
	</div>
	{% endif %}

	{% if sender_address %}
	<div class="sender-address">
		{% for line in sender_address.splitlines(True) %}
		<div>{{ line }}</div>
		{% endfor %}
	</div>
	{% endif %}

	<div class="email-pixel">
		<!--email_open_check-->
	</div>
</div>
